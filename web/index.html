<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Level Up">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Level Up</title>
  <link rel="manifest" href="manifest.json">

  <!-- Tesseract.js și funcția globală OCR pentru Web -->
  <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
  <script>
    window.runOcrOnImage = async function(dataUrl) {
      try {
        const worker = await Tesseract.createWorker('ron');
        const ret = await worker.recognize(dataUrl);
        let text = ret.data.text || "";
        await worker.terminate();

        // Post-procesare avansată pentru separarea corectă a elementelor dintr-un test
        text = text
          .replace(/\r\n/g, '\n')
          // Corectare erori frecvente OCR pentru punctaje
          .replace(/\bSp\b/gi, '(5p)')
          .replace(/\bCp\b/gi, '(10p)')
          .replace(/\(Sp\)/gi, '(5p)')
          .replace(/\(Cp\)/gi, '(10p)')

          // Mutăm punctajele rătăcite la începutul sau sfârșitul liniei corecte
          .replace(/([a-d]\))\s*\(?([0-9]+p)\)?/g, '$2 $1')

          // Forțăm rând nou înaintea fiecărui exercițiu principal (1., 2., etc.)
          .replace(/([.?!])\s*(\d+\.\s+)/g, '$1\n\n$2')
          .replace(/(\n|^)\s*(\d+\.\s+)/g, '\n\n$2')

          // Forțăm rând nou pentru sub-puncte a), b), c), d)
          .replace(/([.;:])\s*([a-d]\)\s+)/g, '$1\n   $2')
          .replace(/(\n|^)\s*([a-d]\)\s+)/g, '\n   $2')

          // Curățare finală pe linii
          .split('\n')
          .map(line => line.replace(/[ \t]+/g, ' ').trim())
          .filter(line => line.length > 0)
          .join('\n');

        return text;
      } typ (err) {
        console.error("Eroare Tesseract JS:", err);
        return "";
      }
    };
  </script>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
